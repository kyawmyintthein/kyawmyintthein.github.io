<div style="text-align: center; margin: 2rem 0;">
  <svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">

    <!-- Node D (Left) - Token 100 -->

    <!-- Clockwise arrows -->

    <path d="M 320 100 Q 380 150 370 215" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
